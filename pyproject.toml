[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "goodsolute"
version = "0.1.0"
authors = [{ name = "Sebastian Wellig" }]
description = "CLI tool for computing Garza's entropy corrections for solvation."
readme = { file = "README.md", content-type = "text/markdown" }
license = { text = "MIT" }
requires-python = ">=3.8"
keywords = []
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.8",
]
dependencies = [
  "rdkit>=2022.9.1",
  "cclib>=1.8",
  "scipy",
]

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/terpy-tools/goodsolute"

[tool.setuptools]
packages = ["goodsolute"]

[tool.ruff]
line-length = 160
src = ["."]

[tool.ruff.format]
quote-style = "single"
skip-magic-trailing-comma = false

[tool.ruff.lint]
preview = true
select = [
  "F",   # Pyflakes
  "E",   # pycodestyle
  "W",   # pycodestyle
  "I",   # isort
  "UP",  # pyupgrade
]
ignore = [
  "E741",   # ambiguous-variable-name
  "W505",   # doc-line-too-long
  "UP012",  # unnecessary-encode-utf8
  "UP015",  # redundant-open-modes
]
